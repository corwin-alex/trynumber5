services:
  - type: web
    name: online-testing-app
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Переменные базы данных автоматически добавляются Render.com
      # при привязке PostgreSQL базы данных
      - key: PGHOST
        fromDatabase:
          name: testing-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: testing-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: testing-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: testing-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: testing-db
          property: password

databases:
  - name: testing-db
    databaseName: testing_db
    user: testing_user
    plan: free
    region: frankfurt
